; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
; anything here applies to ALL environments below

; For the ATO production build make sure it is nanoatmega328, not nanoatmega328new
[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_echo = yes

; Optional liquid level sensors (Low, Reservoir).
; Normal and High sensors are mandatory and always compiled in.
; Uncomment a line below to compile in that sensor for this build.
build_flags =
    ; -D ATO_HAS_LOW_SENSOR
    ; -D ATO_HAS_RESERVOIR_SENSOR

; optional settings
; board_build.f_cpu = 16000000L

; Dev-time only: used to run the Unity test suite on hardware with more
; SRAM headroom than the Nano (ATmega328P: 2KB) can fit. Not used for
; production firmware — that stays on [env:nanoatmega328].
[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_echo = yes
