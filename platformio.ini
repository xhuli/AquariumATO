; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
; anything here applies to ALL environments below
platform = atmelavr
framework = arduino
monitor_echo = yes

; `pio check` runs clang-tidy against the project's own code (src/,
; include/, lib/) using the repo-root .clang-tidy. Framework/toolchain
; package headers are skipped; .clang-tidy's HeaderFilterRegex keeps
; diagnostics to include/ and lib/.
check_tool = clangtidy
check_skip_packages = yes
check_src_filters =
    +<src/>
    +<include/>
    +<lib/>
check_flags =
    clangtidy: --config-file=.clang-tidy

; For the ATO production build make sure it is nanoatmega328, not nanoatmega328new
[env:nanoatmega328]
board = nanoatmega328
; Optional liquid level sensors (Low, Reservoir).
; Normal and High sensors are mandatory and always compiled in.
; Uncomment a line below to compile in that sensor for this build.
build_flags =
    ; -D ATO_HAS_LOW_SENSOR
    ; -D ATO_HAS_RESERVOIR_SENSOR

; Dev-time only: used to run the Unity test suite on hardware with more
; SRAM headroom than the Nano (ATmega328P: 2KB) can fit. Not used for
; production firmware — that stays on [env:nanoatmega328].
[env:megaatmega2560]
board = megaatmega2560
