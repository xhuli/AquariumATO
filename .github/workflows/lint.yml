name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancel a still-running instance of this workflow on the same branch when a
# new push supersedes it, instead of letting both run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-tidy:
    name: clang-tidy (pio check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: pip install -U platformio

      # `pio check` runs clang-tidy per platformio.ini (check_tool = clangtidy)
      # against the project's own src/ + include/ + lib/, using the repo-root
      # .clang-tidy. It fails only on a high-severity defect.
      #
      # The medium-severity list printed to the log is NOT a clean to-do:
      # clang-tidy cannot fully parse this AVR/GCC translation unit (GCC AVR
      # builtins), so its data-flow checks (init-variables, const-correctness,
      # convert-to-static, member-init, branch-clone) emit false positives on
      # trivially-correct code. The reliable signal here is the lexical checks
      # and the high-severity gate; the authoritative linter is CLion/clangd
      # locally, which compiles with the real flags. Do NOT switch this to
      # --fail-on-defect=medium.
      - name: clang-tidy
        run: pio check -e nanoatmega328 --fail-on-defect=high
